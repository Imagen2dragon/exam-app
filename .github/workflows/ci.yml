# Runs on every pull request: the same checks CLAUDE.md asks for before merging.
name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Server tests (Claude is mocked; no API key needed)
        working-directory: server
        run: |
          pip install -r requirements.txt pytest httpx
          python -m pytest -q

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Unit, migration, language and screenshot tests + release lint
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
