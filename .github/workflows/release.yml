# Publishes a signed release whenever a merged PR changes version.txt (e.g. 0.4.0 -> 0.5.0).
# The workflow creates the tag and the GitHub Release itself, so releasing = bump version.txt in a PR and merge.
# Can also be re-run by hand: Actions tab -> Release -> Run workflow.
name: Release
on:
  push:
    branches: [main]
    paths: [version.txt]
  workflow_dispatch:

permissions:
  contents: write   # needed only to create the tag and the GitHub Release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < version.txt)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version.txt must look like 1.2.3"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists - nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.v.outputs.exists != 'true'
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore signing key from secrets
        if: steps.v.outputs.exists != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.TIBEB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing. Add TIBEB_KEYSTORE_BASE64, TIBEB_KEYSTORE_PASSWORD, TIBEB_KEY_ALIAS, TIBEB_KEY_PASSWORD in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build signed APK
        if: steps.v.outputs.exists != 'true'
        working-directory: android
        env:
          TIBEB_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          TIBEB_KEYSTORE_PASSWORD: ${{ secrets.TIBEB_KEYSTORE_PASSWORD }}
          TIBEB_KEY_ALIAS: ${{ secrets.TIBEB_KEY_ALIAS }}
          TIBEB_KEY_PASSWORD: ${{ secrets.TIBEB_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Refuse to publish a debug-signed APK
        if: steps.v.outputs.exists != 'true'
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs "$APK" | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then echo "::error::APK is debug-signed"; exit 1; fi
          cp "$APK" tibeb.apk
          cp "$APK" "tibeb-${{ steps.v.outputs.version }}.apk"
          sha256sum tibeb.apk | cut -d' ' -f1 > sha.txt

      - name: Publish GitHub Release (creates the tag)
        if: steps.v.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          {
            echo "## Download"
            echo "**[tibeb.apk](https://github.com/${{ github.repository }}/releases/download/v${VERSION}/tibeb.apk)** – Android 7.0+, $(du -k tibeb.apk | cut -f1) KB"
            echo
            echo "SHA-256 of the APK: \`$(cat sha.txt)\`"
            echo
            echo "Installing over an earlier release keeps all books, notes and results."
          } > notes.md
          gh release create "v${VERSION}" tibeb.apk "tibeb-${VERSION}.apk" --target "$GITHUB_SHA" \
            --title "Tibeb ${VERSION}" --notes-file notes.md --generate-notes

      - name: Remove signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
