# Builds, signs and publishes the APK when a version tag is pushed, e.g. `git tag v0.4.0 && git push origin v0.4.0`.
# The README links to releases/latest/download/tibeb.apk, so the link always gives the newest version.
name: Release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # needed only to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Version from tag
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "Tag must look like v1.2.3"; exit 1; }
          CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Restore signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.TIBEB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing. Add TIBEB_KEYSTORE_BASE64, TIBEB_KEYSTORE_PASSWORD, TIBEB_KEY_ALIAS, TIBEB_KEY_PASSWORD in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build signed APK
        working-directory: android
        env:
          TIBEB_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          TIBEB_KEYSTORE_PASSWORD: ${{ secrets.TIBEB_KEYSTORE_PASSWORD }}
          TIBEB_KEY_ALIAS: ${{ secrets.TIBEB_KEY_ALIAS }}
          TIBEB_KEY_PASSWORD: ${{ secrets.TIBEB_KEY_PASSWORD }}
        run: >
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          -PtibebVersionName=${{ steps.v.outputs.version }}
          -PtibebVersionCode=${{ steps.v.outputs.code }}

      - name: Refuse to publish a debug-signed APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs "$APK" | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then echo "::error::APK is debug-signed"; exit 1; fi
          cp "$APK" tibeb.apk
          cp "$APK" "tibeb-${{ steps.v.outputs.version }}.apk"
          sha256sum tibeb.apk | cut -d' ' -f1 > sha.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Download"
            echo "**[tibeb.apk](https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/tibeb.apk)** – Android 7.0+, $(du -k tibeb.apk | cut -f1) KB"
            echo
            echo "SHA-256: \`$(cat sha.txt)\`"
            echo
            echo "Installing over an earlier release keeps all books, notes and results."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" tibeb.apk "tibeb-${{ steps.v.outputs.version }}.apk" \
            --title "Tibeb ${{ steps.v.outputs.version }}" --notes-file notes.md --generate-notes

      - name: Remove signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
